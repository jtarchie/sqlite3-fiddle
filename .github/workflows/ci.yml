name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruby:
    name: ruby ${{ matrix.ruby }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby: ["3.3", "3.4", "4.0", "head", "jruby"]
    steps:
      - uses: actions/checkout@v4
      # JRuby 10 needs Java 21; runner images default older
      - uses: actions/setup-java@v4
        if: matrix.ruby == 'jruby'
        with:
          distribution: temurin
          java-version: "21"
      # macOS' own libsqlite3 omits load_extension; lib/ prefers Homebrew's when present
      - if: runner.os == 'macOS'
        run: brew install sqlite
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test TESTOPTS="--seed=1"
        env:
          JRUBY_OPTS: -X+O # the upstream tests count instances with ObjectSpace.each_object
      # the same tests against the sqlite3 gem this one replaces (its C extension does not build on JRuby)
      - if: matrix.ruby != 'jruby'
        run: bundle exec rake test:gem TESTOPTS="--seed=1"

  rugaroo:
    name: compiled by rugaroo / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: sqlite3-fiddle
      - uses: actions/checkout@v4
        with:
          repository: jtarchie/rugaroo
          path: rugaroo
      - uses: actions/setup-go@v5
        with:
          go-version-file: rugaroo/go.mod
      # rugaroo embeds vendored/sqlite3-fiddle, a mirror of its gems/sqlite3-fiddle submodule; put this commit's lib in both
      - run: |
          rm -rf rugaroo/gems/sqlite3-fiddle && cp -r sqlite3-fiddle rugaroo/gems/sqlite3-fiddle
          rm -rf rugaroo/vendored/sqlite3-fiddle && mkdir -p rugaroo/vendored/sqlite3-fiddle && cp -R sqlite3-fiddle/lib/. rugaroo/vendored/sqlite3-fiddle/
      - run: go run ./cmd/rugaroo test ../sqlite3-fiddle/test/sqlite3_test.rb --seed 1
        working-directory: rugaroo
