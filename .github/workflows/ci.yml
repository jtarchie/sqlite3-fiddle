name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruby:
    name: ruby ${{ matrix.ruby }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby: ["3.3", "3.4", "4.0", "head", "jruby"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test TESTOPTS="--seed=1"

  ruby2go:
    name: compiled by ruby2go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: sqlite3-fiddle
      - uses: actions/checkout@v4
        with:
          repository: jtarchie/ruby2go
          path: ruby2go
      - uses: actions/setup-go@v5
        with:
          go-version-file: ruby2go/go.mod
      # ruby2go embeds gems/sqlite3-fiddle/lib; put this checkout there so the compiled copy is this commit's
      - run: rm -rf ruby2go/gems/sqlite3-fiddle && cp -r sqlite3-fiddle ruby2go/gems/sqlite3-fiddle
      - run: go run ./cmd/rb2go test ../sqlite3-fiddle/test/sqlite3_test.rb --seed 1
        working-directory: ruby2go
